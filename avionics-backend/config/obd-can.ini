# Real OBD-II (SAE J1979) signal definitions for a captured CAN log.
# Standard, public encodings: this is not a vendor ICD.
[dictionary]
schema=1
version=obd-can-v1

# data[0]=PCI length, data[1]=0x41 response, data[2]=PID, data[3..]=value

[parameter engine_load]
source=vw
protocol=65541
channel=1
can_id=7E8
match_offset=2
match_value=4
bit_offset=24
bit_width=8
byte_order=big
type=unsigned
scale=0.39215686274509803
unit=%
max_age_ms=500
sequence_step=0

[parameter coolant_temp]
source=vw
protocol=65541
channel=1
can_id=7E8
match_offset=2
match_value=5
bit_offset=24
bit_width=8
byte_order=big
type=unsigned
offset=-40
unit=degC
max_age_ms=500
sequence_step=0

[parameter engine_rpm]
source=vw
protocol=65541
channel=1
can_id=7E8
match_offset=2
match_value=12
bit_offset=24
bit_width=16
byte_order=big
type=unsigned
scale=0.25
unit=rpm
max_age_ms=500
sequence_step=0

[parameter vehicle_speed]
