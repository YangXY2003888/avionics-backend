# Sample-only configuration for the flat export demo. The plugin keys used to
# generate this record (period_ms, loss_prob) are for exercising the data path
# only and must not be used for research conclusions.
[dictionary]
schema=1
version=flat-demo-v1

[parameter temperature]
source=src
protocol=65535
channel=0
bit_offset=0
bit_width=64
byte_order=little
type=signed
scale=0.001
unit=degC
max_age_ms=200
sequence_step=1
nominal_period_ns=10000000

[clock src]
domain=1
group=host
offset_ns=0
uncertainty_ns=0
